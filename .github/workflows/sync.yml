name: sync-notion

on:
  push:
    branches: [main]
    paths:
      - 'inbox/**'
      - '.github/scripts/**'
      - 'config/**'
  workflow_dispatch:

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync inbox to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python .github/scripts/sync.py

      - name: Commit processed markers
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add processed/ inbox/ state/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark synced inbox items"
            git push
          else
            echo "nothing to commit"
          fi
